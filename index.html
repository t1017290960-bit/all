<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<title>多網址快速跳轉</title>
<style>
body{background:linear-gradient(145deg,#eff6ff,#f8fafc 48%,#ecfeff);font-family:system-ui,-apple-system,"Segoe UI",sans-serif} .glass{background:rgba(255,255,255,.88);backdrop-filter:blur(10px)}
#viewer:fullscreen{width:100vw;height:100vh;margin:0;border-radius:0;display:flex;flex-direction:column}#viewer:fullscreen #pageFrame{height:auto;min-height:0;flex:1}
</style>
</head>
<body class="min-h-screen text-slate-800">
<main class="max-w-3xl mx-auto px-4 py-10 sm:py-14">
<header class="mb-8"><div class="inline-flex items-center gap-2 rounded-full bg-blue-100 px-3 py-1 text-sm font-semibold text-blue-700">🔗 網址工具</div><h1 class="mt-4 text-3xl sm:text-4xl font-extrabold tracking-tight">多網址快速跳轉</h1><p class="mt-2 text-slate-600">把網址逐行貼上，新增後可在本頁面顯示，也可另開分頁。</p></header>
<section id="viewer" class="mb-6 hidden overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl">
<div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 p-4 sm:p-5"><div class="min-w-0"><p class="text-xs font-bold uppercase tracking-wide text-slate-500">目前顯示</p><p id="viewerLabel" class="mt-1 truncate font-semibold text-slate-800"></p></div><div class="flex items-center gap-2"><button id="fullScreenBtn" type="button" class="rounded-xl bg-blue-600 px-3 py-2 text-sm font-semibold text-white hover:bg-blue-700">全螢幕 ⛶</button><a id="externalLink" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50" target="_blank" rel="noopener noreferrer">另開分頁 ↗</a><button id="closeViewer" type="button" class="rounded-xl px-3 py-2 text-sm font-semibold text-slate-500 hover:bg-slate-100">關閉</button></div></div>
<p class="px-4 pt-3 text-xs text-slate-500 sm:px-5">若網站禁止嵌入而無法顯示，請改用「另開分頁」。</p>
<iframe id="pageFrame" title="網址頁面預覽" class="mt-3 h-[65vh] min-h-[420px] w-full border-t border-slate-100 bg-white" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
</section>
<section class="glass rounded-3xl border border-white p-5 sm:p-7 shadow-xl shadow-blue-900/5">
<label for="urlInput" class="block text-sm font-bold mb-2">輸入網址（每行一個）</label>
<textarea id="urlInput" rows="4" placeholder="example.com\nhttps://www.wikipedia.org" class="w-full resize-y rounded-2xl border border-slate-200 bg-white p-4 outline-none focus:border-blue-400 focus:ring-4 focus:ring-blue-100"></textarea>
<div class="mt-3 flex flex-wrap items-center gap-3"><button id="addBtn" class="rounded-xl bg-blue-600 px-5 py-3 font-bold text-white shadow-lg shadow-blue-600/20 hover:bg-blue-700 active:scale-[.98]">＋ 新增網址</button><span id="status" class="text-sm text-slate-500" role="status" aria-live="polite"></span></div>
<div class="mt-7 rounded-2xl border border-blue-100 bg-blue-50/60 p-4"><div class="flex items-center justify-between gap-3"><h2 class="font-bold">最近輸入記錄 <span id="historyCount" class="ml-1 rounded-full bg-white px-2 py-0.5 text-sm text-slate-600">0</span></h2><button id="clearHistoryBtn" class="text-sm font-semibold text-slate-500 hover:text-rose-600">清除記錄</button></div><div id="historyList" class="mt-3 space-y-2"></div><p id="historyEmpty" class="mt-3 text-sm text-slate-500">尚無輸入記錄；新增有效網址後會自動保留最近 30 筆。</p></div>
<div class="mt-7 flex items-center justify-between gap-3"><h2 class="text-lg font-bold">我的網址 <span id="count" class="ml-1 rounded-full bg-slate-100 px-2 py-0.5 text-sm text-slate-600">0</span></h2><button id="clearBtn" class="text-sm font-semibold text-rose-600 hover:text-rose-700">清空全部</button></div>
<div id="list" class="mt-4 space-y-3"></div>
<div id="empty" class="rounded-2xl border border-dashed border-slate-300 bg-white/60 px-4 py-9 text-center text-slate-500"><div class="text-3xl">🧭</div><p class="mt-2 font-medium">還沒有網址，貼上幾個網址開始使用吧。</p></div>
</section>
<p class="mt-5 text-center text-xs text-slate-500">網址只接受 HTTP 或 HTTPS；未輸入 https:// 時會自動補上。</p>
</main>
<script>
const input=document.getElementById('urlInput'), list=document.getElementById('list'), statusEl=document.getElementById('status');
let urls=[],history=[];
function normalize(raw){let s=raw.trim(); if(!s)return null; if(!/^https?:\/\//i.test(s))s='https://'+s; try{const u=new URL(s); if(!['http:','https:'].includes(u.protocol)||!u.hostname||u.username||u.password)return null; return {url:u.href,label:u.hostname+u.pathname+(u.search||'')};}catch{return null}}
function make(tag,cls,text){const el=document.createElement(tag); if(cls)el.className=cls; if(text!==undefined)el.textContent=text; return el}
function showInPage(item){const viewer=document.getElementById('viewer');document.getElementById('viewerLabel').textContent=item.title||item.url;const frame=document.getElementById('pageFrame');frame.src=item.url;document.getElementById('externalLink').href=item.url;viewer.classList.remove('hidden');viewer.scrollIntoView({behavior:'smooth',block:'start'});statusEl.textContent='已在本頁面載入；若網站限制內嵌，請改用另開分頁。'}
const closeViewer=document.getElementById('closeViewer');if(closeViewer)closeViewer.addEventListener('click',()=>{document.getElementById('pageFrame').src='about:blank';document.getElementById('viewer').classList.add('hidden')});
const fullScreenBtn=document.getElementById('fullScreenBtn'),viewer=document.getElementById('viewer');fullScreenBtn.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await viewer.requestFullscreen()}catch(e){console.error(e);statusEl.textContent='無法進入全螢幕，請確認瀏覽器允許此操作。'}});document.addEventListener('fullscreenchange',()=>{fullScreenBtn.textContent=document.fullscreenElement?'離開全螢幕':'全螢幕 ⛶'});
async function persist(){try{await window.sayoStorage.setItem('savedUrls',JSON.stringify(urls));}catch(e){console.error(e); statusEl.textContent='儲存失敗，請稍後再試。';}}
async function persistHistory(){try{await window.sayoStorage.setItem('urlHistory',JSON.stringify(history));return true;}catch(e){console.error(e);return false;}}
function renderHistory(){const box=document.getElementById('historyList');box.replaceChildren();document.getElementById('historyCount').textContent=String(history.length);document.getElementById('historyEmpty').classList.toggle('hidden',history.length>0);history.slice(0,10).forEach(item=>{const row=make('div','flex flex-wrap items-center justify-between gap-2 rounded-xl bg-white px-3 py-2');const details=make('div','min-w-0 flex-1');details.append(make('div','truncate text-sm font-semibold text-slate-700',item.title||item.url),make('div','truncate text-xs text-slate-500',item.at?new Date(item.at).toLocaleString():''));const use=make('button','shrink-0 rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-semibold text-blue-700 hover:bg-blue-50','填入輸入框');use.type='button';use.addEventListener('click',()=>{input.value=item.url;input.focus();statusEl.textContent='已填入輸入框。'});row.append(details,use);box.append(row);});}
function render(){list.replaceChildren(); document.getElementById('count').textContent=String(urls.length); document.getElementById('empty').classList.toggle('hidden',urls.length>0);
urls.forEach((item,i)=>{const card=make('div','flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-4 sm:flex-row sm:items-center sm:justify-between'); const info=make('div','min-w-0'); info.append(make('div','truncate font-bold text-slate-800',item.title||new URL(item.url).hostname)); const link=make('div','mt-1 truncate text-sm text-slate-500',item.url); info.append(link); const actions=make('div','flex shrink-0 items-center gap-2'); const open=make('button','rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-bold text-white hover:bg-emerald-700','本頁顯示'); open.type='button'; open.addEventListener('click',()=>showInPage(item)); const external=make('a','rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50','新分頁 ↗'); external.href=item.url; external.target='_blank'; external.rel='noopener noreferrer'; const del=make('button','rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-semibold text-slate-600 hover:border-rose-200 hover:text-rose-600','刪除'); del.type='button'; del.addEventListener('click',async()=>{urls.splice(i,1);await persist();render();statusEl.textContent='已刪除網址。'}); actions.append(open,external,del); card.append(info,actions); list.append(card);});renderHistory();}
document.getElementById('addBtn').addEventListener('click',async()=>{const lines=input.value.split(/\n/).map(x=>x.trim()).filter(Boolean); if(!lines.length){statusEl.textContent='請先輸入至少一個網址。';return;} let added=0,bad=0,dupes=0; for(const line of lines){const parsed=normalize(line);if(!parsed){bad++;continue;}history.unshift({url:parsed.url,title:parsed.label,at:Date.now()});if(urls.some(x=>x.url===parsed.url)){dupes++;continue;}urls.push({url:parsed.url,title:parsed.label});added++;}history=history.slice(0,30);await persist();const historySaved=await persistHistory();render();input.value='';statusEl.textContent=`新增 ${added} 個；無效 ${bad} 個；重複略過 ${dupes} 個。${historySaved?'輸入記錄已保存。':'輸入記錄儲存失敗。'}`;});
document.getElementById('clearHistoryBtn').addEventListener('click',async()=>{history=[];const saved=await persistHistory();renderHistory();statusEl.textContent=saved?'已清除輸入記錄。':'記錄清除失敗，請稍後再試。'});
document.getElementById('clearBtn').addEventListener('click',async()=>{if(!urls.length)return;urls=[];await persist();render();statusEl.textContent='已清空所有網址。';});
(async()=>{try{const raw=await window.sayoStorage.getItem('savedUrls');if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed))urls=parsed.filter(x=>x&&typeof x.url==='string'&&normalize(x.url));}const historyRaw=await window.sayoStorage.getItem('urlHistory');if(historyRaw){const parsedHistory=JSON.parse(historyRaw);if(Array.isArray(parsedHistory))history=parsedHistory.filter(x=>x&&typeof x.url==='string'&&normalize(x.url)).slice(0,30);}}catch(e){console.error(e);statusEl.textContent='無法讀取已儲存的網址記錄。';}render();})();
</script>
</body>
</html>
